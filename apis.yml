aid: zerodha

name: Zerodha

image: https://zerodha.com/static/images/kite-trade/kite-connect-og.png

description: Zerodha is India’s leading retail stock‑broking platform offering a suite of developer‑focused APIs called Kite Connect. The APIs
  provide REST endpoints and WebSocket streams for order execution, portfolio management, market data, mutual funds, margins, and more. Built
  for traders, platforms and fintechs, they enable automation of trading strategies and integration with third‑party services, backed by extensive
  SDKs and documentation.

